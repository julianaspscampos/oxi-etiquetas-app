appId: br.com.oxiindustria.etiquetas
productName: Oxi Etiquetas
copyright: Copyright © 2026 Oxi Indústria

directories:
  output: dist
  buildResources: build

files:
  - main.js
  - preload.js
  - index.html
  - build/icon.png
  - node_modules/electron-updater/**

publish:
